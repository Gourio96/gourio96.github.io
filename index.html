<style>
:root{
  --crema:#FFF9F3;--marfil:#FBF1E8;
  --rosa:#F7DCD7;--rosa-f:#E9B7B0;--rosa-t:#A15560;
  --lila:#E9E1F4;--lila-t:#65508F;
  --menta:#DDEFE4;--menta-t:#2E7A58;
  --cielo:#DFEAF2;--cielo-t:#3C6E96;
  --oro:#C79B5C;--oro-osc:#8A6A33;--oro-claro:#DDBA7E;
  --tinta:#4B3A40;--tinta-suave:#6B565D;--noche:#33272C;
  --wa:#4FB286;--wa-osc:#2F8F66;
  --sombra:0 24px 60px -24px rgba(110,70,80,.28);
  --f-d:'Fraunces',serif;--f-b:'Jost',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--f-b);color:var(--tinta);background:var(--crema);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.6;
  background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='72' height='72'><path d='M36 12l5 19 19 5-19 5-5 19-5-19-19-5 19-5z' fill='none' stroke='%23C79B5C' stroke-opacity='.10'/></svg>");}
main,header,footer{position:relative;z-index:1}
::selection{background:var(--rosa);color:var(--rosa-t)}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
h1,h2,h3,.serif{font-family:var(--f-d)}
:focus-visible{outline:3px solid var(--oro);outline-offset:3px;border-radius:8px}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:var(--marfil)}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--oro-claro),var(--oro));border-radius:99px;border:2px solid var(--marfil)}
.saltar{position:absolute;left:-999px;top:0;background:var(--tinta);color:#fff;padding:12px 20px;border-radius:0 0 12px 0;z-index:600;font-weight:600}
.saltar:focus{left:0}
/* LOADER */
#loader{position:fixed;inset:0;background:var(--crema);z-index:700;display:grid;place-items:center;transition:opacity .7s,visibility .7s}
#loader.fin{opacity:0;visibility:hidden}
#loader svg{width:86px;height:86px}
#loader .trazo{stroke-dasharray:170;stroke-dashoffset:170;animation:dibujar 1.4s ease forwards}
#loader .gota{opacity:0;animation:aparecer .6s .9s ease forwards}
#loader p{margin-top:14px;font-size:.7rem;letter-spacing:.4em;text-transform:uppercase;color:var(--oro-osc);text-align:center;animation:aparecer .8s .4s ease both}
@keyframes dibujar{to{stroke-dashoffset:0}}
@keyframes aparecer{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

#progreso{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--oro),var(--rosa-f),var(--lila-t));z-index:400;border-radius:0 99px 99px 0}

/* Instagram circular */
.btn-ig-circ{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;position:relative;background:linear-gradient(135deg,#EBA9C6,#D68AA0 48%,#B188C6);color:#fff;box-shadow:0 10px 22px -8px rgba(177,136,198,.6);transition:transform .35s}

.btn-ig-circ:hover .tip-ig{opacity:1;transform:translateY(-50%)}

.btn-solido-oro:hover{transform:translateY(-3px)}
.btn-solido-oro:hover::before{left:130%}
.enlace-ig{display:inline-flex;align-items:center;gap:9px;font-weight:500;color:var(--rosa-t);transition:gap .3s}
.enlace-ig:hover{gap:13px}
.enlace-ig .circ-ig{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(135deg,#EBA9C6,#D68AA0 48%,#B188C6)}
.enlace-ig .circ-ig svg{width:13px;height:13px}

.hero{max-width:1240px;margin:auto;padding:170px 26px 90px;display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;position:relative}
.hero-over{display:inline-flex;align-items:center;gap:10px;font-size:.72rem;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--oro-osc);margin-bottom:24px}
.hero-over::before{content:"";width:44px;height:1px;background:var(--oro)}
.hero h1{font-size:clamp(2.9rem,6vw,5rem);font-weight:600;line-height:1.02;letter-spacing:-.01em}
.hero h1 em{font-style:italic;font-weight:600;color:var(--oro-osc)}
.hero h1 .linea{display:block;overflow:hidden}
.hero h1 .linea span{display:block;animation:subir 1s cubic-bezier(.2,.7,.2,1) both}
.hero h1 .linea:nth-child(2) span{animation-delay:.15s}
@keyframes subir{from{transform:translateY(110%)}to{transform:none}}
.hero p{margin:26px 0 34px;font-size:1.08rem;font-weight:300;color:var(--tinta-suave);max-width:520px;line-height:1.8}
.hero-ctas{display:flex;gap:28px;flex-wrap:wrap;align-items:center}
.hero-stats{display:flex;gap:0;margin-top:52px}
.stat{padding:0 30px;border-left:1px solid rgba(199,155,92,.35)}

.hero-visual{position:relative}
.hero-estrella{position:absolute;top:-56px;right:-40px;width:150px;height:150px;animation:rotar 46s linear infinite;opacity:.8}
.hero-marco{border-radius:230px 230px 30px 30px;overflow:hidden;border:7px solid #fff;box-shadow:var(--sombra);position:relative;animation:flotar 7s ease-in-out infinite}
.hero-marco img{width:100%;height:580px;object-fit:cover}
.hero-marco::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 -60px 90px -50px rgba(75,58,64,.35)}
@keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.hero-chip{position:absolute;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-radius:16px;padding:11px 18px;box-shadow:var(--sombra);font-size:.8rem;font-weight:500;animation:flotar 5.5s ease-in-out infinite}
.hero-chip.c1{top:14%;left:-34px;background:var(--rosa);animation-delay:.8s}
.hero-chip.c2{bottom:18%;right:-28px;background:var(--menta);animation-delay:1.6s}
.hero-chip.c3{top:50%;right:-44px;background:var(--lila);animation-delay:2.4s}
.hero-scroll{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:var(--tinta-suave);display:flex;flex-direction:column;align-items:center;gap:8px}
.hero-scroll i{width:1px;height:44px;background:var(--oro);display:block;animation:caer 1.8s ease-in-out infinite;transform-origin:top}
@keyframes caer{0%{transform:scaleY(0)}55%{transform:scaleY(1)}100%{transform:scaleY(0);transform-origin:bottom}}
/* MARQUESINA */
.marquee{background:linear-gradient(90deg,var(--rosa),var(--lila) 35%,var(--menta) 70%,var(--cielo));overflow:hidden;padding:18px 0;border-block:1px solid rgba(199,155,92,.25)}

.contenedor{max-width:1240px;margin:auto}
